name: ci
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix: { node: [20, 22] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: yarn }
      - run: corepack enable && yarn install --immutable
      - run: yarn verify
      # M0.2: the §4 dependency diagram is enforced, not advisory (dist is
      # built by `yarn verify` above, so the checker bundle exists).
      - run: yarn deps:check
  # M0.1 (§10.2): every PR that changes packages/** ships a changeset.
  # `changeset status` exits 1 when a package changed without one.
  changesets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: yarn }
      - run: corepack enable && yarn install --immutable
      - run: yarn changeset status --since=origin/main
